<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers | FreshGrocery</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    /* Laptop / Windows Desktop Suppliers UI */
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
      gap: 18px;
      margin-bottom: 22px;
    }
    @media (max-width: 720px) {
      .metrics-bar {
        grid-template-columns: 1fr;
      }
    }
    .metric-mini-card {
      background: #ffffff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }
    .metric-mini-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .metric-mini-lbl {
      font-size: 12px;
      color: var(--gray-500);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .metric-mini-val {
      font-size: 26px;
      font-weight: 800;
      color: var(--gray-900);
      line-height: 1.15;
    }
    .metric-mini-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      background: var(--primary-50);
      border: 1px solid var(--primary-100);
    }
    .metric-mini-icon.blue {
      background: var(--accent-blue-light);
      border-color: #bfdbfe;
    }

    /* Filter Toolbar */
    .toolbar-container {
      background: #ffffff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }
    .toolbar-filters {
      display: flex;
      gap: 12px;
      align-items: center;
      flex: 1;
      min-width: 280px;
      max-width: 560px;
    }
    .search-input-wrap {
      position: relative;
      flex: 1;
    }
    .search-input-wrap .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--gray-400);
      pointer-events: none;
    }
    .search-input-wrap .form-control {
      padding-left: 36px;
      height: 40px;
    }
    .status-filter-select {
      width: 165px;
      height: 40px;
      padding: 8px 12px;
    }
    .btn-toolbar {
      height: 40px;
      padding: 0 20px;
      font-size: 13.5px;
    }
    .table-actions-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn-table-action {
      height: 34px;
      padding: 0 13px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      border: 1px solid var(--gray-300);
      background: #ffffff;
      color: var(--gray-700);
      transition: all var(--transition-fast);
      box-shadow: none;
    }
    .btn-table-action:hover {
      background: var(--gray-100);
      border-color: var(--gray-400);
      color: var(--gray-900);
      transform: translateY(-1px);
    }
    .btn-table-action-danger {
      color: #be123c;
      border-color: #fecdd3;
      background: #fff1f2;
    }
    .btn-table-action-danger:hover {
      background: #ffe4e6;
      border-color: #fda4af;
      color: #9f1239;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="topbar-container"></div>
      <main class="content-body">

        <!-- Metrics Ribbon -->
        <div class="metrics-bar">
          <div class="metric-mini-card">
            <div>
              <div class="metric-mini-lbl">Active Supply Vendors</div>
              <div class="metric-mini-val" id="metric-total-suppliers">0</div>
            </div>
            <div class="metric-mini-icon blue">🏢</div>
          </div>
          <div class="metric-mini-card">
            <div>
              <div class="metric-mini-lbl">Active / Verified Vendors</div>
              <div class="metric-mini-val" id="metric-active-suppliers" style="color: var(--primary-700);">0</div>
            </div>
            <div class="metric-mini-icon">✅</div>
          </div>
        </div>

        <!-- Filter Toolbar -->
        <div class="toolbar-container">
          <div class="toolbar-filters">
            <div class="search-input-wrap">
              <span class="search-icon">🔍</span>
              <input
                type="text"
                id="supplier-search-input"
                class="form-control"
                placeholder="Search vendor name, contact, phone, or GST..."
              />
            </div>
            <select id="supplier-status-filter" class="form-control status-filter-select">
              <option value="ALL">All Statuses</option>
              <option value="ACTIVE">Active</option>
              <option value="ON_HOLD">On Hold</option>
            </select>
          </div>
          <button type="button" class="btn btn-primary btn-toolbar" id="btn-add-supplier">
            <span class="btn-icon-circle">+</span>
            <span>Add New Supplier</span>
          </button>
        </div>

        <!-- Suppliers Table -->
        <div class="table-container">
          <table class="table data-table">
            <thead>
              <tr>
                <th>Code &amp; Company Name</th>
                <th>Contact Person</th>
                <th style="white-space: nowrap;">Phone / Email</th>
                <th style="white-space: nowrap;">GSTIN / Tax ID</th>
                <th style="text-align: center; white-space: nowrap;">Payment Terms</th>
                <th>Address</th>
                <th style="text-align: center; white-space: nowrap;">Status</th>
                <th style="text-align: right; white-space: nowrap;">Actions</th>
              </tr>
            </thead>
            <tbody id="suppliers-table-body">
              <tr>
                <td colspan="8" style="text-align: center; padding: 40px; color: var(--gray-400);">
                  Loading supplier directory...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <!-- ADD / EDIT SUPPLIER MODAL -->
  <div class="modal-overlay" id="supplier-modal">
    <div class="modal-content" style="max-width: 580px;">
      <div class="modal-header">
        <h3 class="modal-title" id="sup-modal-title">Add New Supplier</h3>
        <button type="button" class="modal-close-btn" id="close-sup-modal">&times;</button>
      </div>
      <form id="supplier-form">
        <div class="modal-body" style="padding: 20px 24px;">
          <input type="hidden" id="sup-id" />

          <div class="form-row">
            <div class="form-group" style="flex: 2;">
              <label class="form-label" for="sup-name">Company / Supplier Name *</label>
              <input type="text" id="sup-name" class="form-control" required placeholder="e.g. Amul Fresh Distributors" />
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label" for="sup-code">Vendor Code</label>
              <input type="text" id="sup-code" class="form-control" placeholder="SUP-01" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="sup-contact">Contact Person Name</label>
              <input type="text" id="sup-contact" class="form-control" placeholder="e.g. Rajesh Kumar" />
            </div>
            <div class="form-group">
              <label class="form-label" for="sup-phone">Phone Number *</label>
              <input type="text" id="sup-phone" class="form-control" required placeholder="9876543210" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="sup-email">Email Address</label>
              <input type="email" id="sup-email" class="form-control" placeholder="vendor@amul.local" />
            </div>
            <div class="form-group">
              <label class="form-label" for="sup-gstin">GSTIN / Tax ID</label>
              <input type="text" id="sup-gstin" class="form-control" placeholder="29ABCDE1234F1Z5" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="sup-terms">Payment Terms</label>
              <select id="sup-terms" class="form-control">
                <option value="Net 15">Net 15 Days</option>
                <option value="Net 30">Net 30 Days</option>
                <option value="COD">Cash on Delivery (COD)</option>
                <option value="Advance">Advance Payment</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="sup-status">Status</label>
              <select id="sup-status" class="form-control">
                <option value="ACTIVE">ACTIVE</option>
                <option value="ON_HOLD">ON HOLD</option>
              </select>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="sup-address">Warehouse / City Address</label>
            <textarea id="sup-address" class="form-control" rows="2" placeholder="Warehouse address, City, PIN..."></textarea>
          </div>
        </div>

        <div class="modal-footer" style="padding: 16px 24px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="btn btn-secondary" id="btn-cancel-sup">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-sup">Save Supplier</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { Layout } from './js/layout.js';
    import { Api } from './js/api.js';

    Layout.init({ activePage: 'suppliers', title: 'Supplier Directory' });

    let suppliers = [];
    const tableBody = document.getElementById('suppliers-table-body');
    const searchInput = document.getElementById('supplier-search-input');
    const statusFilter = document.getElementById('supplier-status-filter');
    const supModal = document.getElementById('supplier-modal');
    const supForm = document.getElementById('supplier-form');

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadSuppliers() {
      try {
        const res = await Api.get('/suppliers').catch(() => []);
        suppliers = Array.isArray(res) ? res : (res.data || []);

        document.getElementById('metric-total-suppliers').textContent = suppliers.length;
        document.getElementById('metric-active-suppliers').textContent = suppliers.filter(s => s.status === 'ACTIVE' || !s.status).length;

        renderTable();
      } catch (err) {
        showToast('Error loading suppliers: ' + err.message, 'error');
      }
    }

    function renderTable() {
      const q = searchInput.value.toLowerCase().trim();
      const st = statusFilter.value;
      const filtered = suppliers.filter(s => {
        const matchesQ = !q ||
          (s.name && s.name.toLowerCase().includes(q)) ||
          (s.contactPerson && s.contactPerson.toLowerCase().includes(q)) ||
          (s.phone && s.phone.includes(q)) ||
          (s.gstin && s.gstin.toLowerCase().includes(q));
        const statusVal = s.status || 'ACTIVE';
        const matchesSt = st === 'ALL' || statusVal === st;
        return matchesQ && matchesSt;
      });

      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="8" style="text-align: center; padding: 40px; color: var(--gray-400);">
              No suppliers found. Click <strong>Add New Supplier</strong> to create one.
            </td>
          </tr>
        `;
        return;
      }

      tableBody.innerHTML = filtered.map(s => `
        <tr>
          <td>
            <div style="font-weight: 700; color: var(--gray-900);">${escapeHtml(s.name)}</div>
            <div style="font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--gray-500);">${escapeHtml(s.code || '-')}</div>
          </td>
          <td>${escapeHtml(s.contactPerson || '-')}</td>
          <td style="white-space: nowrap;">
            <div>${escapeHtml(s.phone || '-')}</div>
            ${s.email ? `<div style="font-size: 11.5px; color: var(--gray-500);">${escapeHtml(s.email)}</div>` : ''}
          </td>
          <td style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; white-space: nowrap;">${escapeHtml(s.gstin || '-')}</td>
          <td style="text-align: center; white-space: nowrap;"><span class="badge badge-neutral">${escapeHtml(s.paymentTerms || 'Net 30')}</span></td>
          <td style="font-size: 12.5px; color: var(--gray-600); max-width: 220px;">${escapeHtml(s.address || '-')}</td>
          <td style="text-align: center; white-space: nowrap;"><span class="badge ${s.status === 'ON_HOLD' ? 'badge-warning' : 'badge-success'}">${escapeHtml(s.status || 'ACTIVE')}</span></td>
          <td style="text-align: right; white-space: nowrap;">
            <div class="table-actions-wrap">
              <button type="button" class="btn-table-action btn-edit-sup" data-id="${escapeHtml(s.id)}" title="Edit supplier">✏️ Edit</button>
              <button type="button" class="btn-table-action btn-table-action-danger btn-del-sup" data-id="${escapeHtml(s.id)}" title="Delete supplier">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');

      tableBody.querySelectorAll('.btn-edit-sup').forEach(b => {
        b.addEventListener('click', () => openEditSupplier(b.dataset.id));
      });
      tableBody.querySelectorAll('.btn-del-sup').forEach(b => {
        b.addEventListener('click', () => deleteSupplier(b.dataset.id));
      });
    }

    searchInput.addEventListener('input', renderTable);
    statusFilter.addEventListener('change', renderTable);

    document.getElementById('btn-add-supplier').addEventListener('click', () => {
      document.getElementById('sup-modal-title').textContent = 'Add New Supplier';
      supForm.reset();
      document.getElementById('sup-id').value = '';
      supModal.classList.add('active');
      document.getElementById('sup-name').focus();
    });

    document.getElementById('close-sup-modal').addEventListener('click', () => supModal.classList.remove('active'));
    document.getElementById('btn-cancel-sup').addEventListener('click', () => supModal.classList.remove('active'));

    function openEditSupplier(id) {
      const s = suppliers.find(item => item.id === id);
      if (!s) return;

      document.getElementById('sup-modal-title').textContent = 'Edit Supplier';
      document.getElementById('sup-id').value = s.id;
      document.getElementById('sup-name').value = s.name;
      document.getElementById('sup-code').value = s.code || '';
      document.getElementById('sup-contact').value = s.contactPerson || '';
      document.getElementById('sup-phone').value = s.phone || '';
      document.getElementById('sup-email').value = s.email || '';
      document.getElementById('sup-gstin').value = s.gstin || '';
      document.getElementById('sup-terms').value = s.paymentTerms || 'Net 15';
      document.getElementById('sup-status').value = s.status || 'ACTIVE';
      document.getElementById('sup-address').value = s.address || '';

      supModal.classList.add('active');
    }

    supForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('sup-id').value;
      const payload = {
        name: document.getElementById('sup-name').value.trim(),
        code: document.getElementById('sup-code').value.trim(),
        contactPerson: document.getElementById('sup-contact').value.trim(),
        phone: document.getElementById('sup-phone').value.trim(),
        email: document.getElementById('sup-email').value.trim(),
        gstin: document.getElementById('sup-gstin').value.trim(),
        paymentTerms: document.getElementById('sup-terms').value,
        status: document.getElementById('sup-status').value,
        address: document.getElementById('sup-address').value.trim()
      };

      try {
        const btn = document.getElementById('btn-save-sup');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        if (id) {
          await Api.put(`/suppliers/${id}`, payload);
          showToast('Supplier updated successfully', 'success');
        } else {
          await Api.post('/suppliers', payload);
          showToast('Supplier added successfully', 'success');
        }

        supModal.classList.remove('active');
        await loadSuppliers();
      } catch (err) {
        showToast(err.message || 'Failed to save supplier', 'error');
      } finally {
        const btn = document.getElementById('btn-save-sup');
        btn.disabled = false;
        btn.textContent = 'Save Supplier';
      }
    });

    async function deleteSupplier(id) {
      if (!confirm('Are you sure you want to delete this supplier?')) return;
      try {
        await Api.delete(`/suppliers/${id}`);
        showToast('Supplier deleted', 'success');
        await loadSuppliers();
      } catch (err) {
        showToast(err.message || 'Failed to delete supplier', 'error');
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '⚠️' : 'ℹ️'}</span> <span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    loadSuppliers();
  </script>
</body>
</html>
