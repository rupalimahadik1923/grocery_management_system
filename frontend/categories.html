<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories | FreshGrocery</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .metric-mini-card {
      background: #ffffff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }
    .metric-mini-val {
      font-size: 24px;
      font-weight: 800;
      color: var(--gray-900);
    }
    .metric-mini-lbl {
      font-size: 12px;
      color: var(--gray-500);
      font-weight: 500;
    }
    .toolbar-container {
      background: #ffffff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .category-card {
      background: #ffffff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all var(--transition-fast);
    }
    .category-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--primary-400);
    }
    .category-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .category-icon-box {
      font-size: 36px;
      background: var(--gray-100);
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
    }
    .view-toggle-btn {
      padding: 8px 14px;
      background: var(--gray-100);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--gray-300);
    }
    .view-toggle-btn.active {
      background: var(--primary-600);
      color: #ffffff;
      border-color: var(--primary-600);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="topbar-container"></div>
      <main class="content-body">
        
        <!-- Metrics Bar -->
        <div class="metrics-bar">
          <div class="metric-mini-card">
            <div>
              <div class="metric-mini-val" id="metric-total-cats">0</div>
              <div class="metric-mini-lbl">Total Categories</div>
            </div>
            <div style="font-size: 30px;">🏷️</div>
          </div>
          <div class="metric-mini-card">
            <div>
              <div class="metric-mini-val" id="metric-total-assigned" style="color: var(--primary-700);">0</div>
              <div class="metric-mini-lbl">Assigned Products</div>
            </div>
            <div style="font-size: 30px;">📦</div>
          </div>
          <div class="metric-mini-card">
            <div>
              <div class="metric-mini-val" id="metric-active-cats" style="color: var(--primary-600);">0</div>
              <div class="metric-mini-lbl">Active in POS</div>
            </div>
            <div style="font-size: 30px;">✅</div>
          </div>
        </div>

        <!-- Toolbar & View Switcher -->
        <div class="toolbar-container">
          <div style="display: flex; gap: 10px; flex: 1; max-width: 400px;">
            <input 
              type="text" 
              id="category-search" 
              class="form-control" 
              placeholder="Search category name..." 
            />
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <div style="display: flex; gap: 4px; margin-right: 8px;">
              <button class="view-toggle-btn active" id="btn-view-cards">Card View 🗂️</button>
              <button class="view-toggle-btn" id="btn-view-table">Table View 📋</button>
            </div>
            <button class="btn btn-primary" id="btn-add-category">➕ Create Category</button>
          </div>
        </div>

        <!-- CARDS VIEW -->
        <div id="category-cards-container" class="category-grid">
          <!-- Injected via JavaScript -->
        </div>

        <!-- TABLE VIEW -->
        <div id="category-table-container" class="table-container" style="display: none;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Icon</th>
                <th>Category Name</th>
                <th>Slug</th>
                <th>Description</th>
                <th>Display Order</th>
                <th>Products Count</th>
                <th>Status</th>
                <th style="text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody id="category-table-body">
              <!-- Injected via JavaScript -->
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <!-- ADD / EDIT CATEGORY MODAL -->
  <div class="modal-overlay" id="category-modal">
    <div class="modal-content" style="max-width: 480px;">
      <div class="modal-header">
        <h3 class="modal-title" id="cat-modal-title">Create Category</h3>
        <button class="modal-close-btn" id="close-cat-modal">&times;</button>
      </div>
      <form id="category-form">
        <div class="modal-body" style="padding: 20px 24px;">
          <input type="hidden" id="cat-id" />
          
          <div class="form-row">
            <div class="form-group" style="flex: 2;">
              <label class="form-label">Category Name *</label>
              <input type="text" id="cat-name" class="form-control" required placeholder="e.g. Dairy & Milk" />
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Emoji / Icon</label>
              <input type="text" id="cat-icon" class="form-control" placeholder="🥛" maxlength="4" style="text-align: center; font-size: 20px;" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Slug / Key</label>
              <input type="text" id="cat-slug" class="form-control" placeholder="dairy-milk" />
            </div>
            <div class="form-group">
              <label class="form-label">Display Order</label>
              <input type="number" id="cat-order" class="form-control" value="1" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea id="cat-desc" class="form-control" rows="2" placeholder="Brief description of items..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Visibility Status</label>
            <select id="cat-active" class="form-control">
              <option value="true">Active (Visible in POS)</option>
              <option value="false">Hidden / Inactive</option>
            </select>
          </div>
        </div>

        <div class="modal-footer" style="padding: 16px 24px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 8px;">
          <button type="button" class="btn btn-secondary" id="btn-cancel-cat">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-cat">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { Layout } from './js/layout.js';
    import { Api } from './js/api.js';

    Layout.init({ activePage: 'categories', title: 'Product Categories' });

    let categories = [];
    let products = [];
    let currentView = 'cards';

    const searchInput = document.getElementById('category-search');
    const cardsContainer = document.getElementById('category-cards-container');
    const tableContainer = document.getElementById('category-table-container');
    const tableBody = document.getElementById('category-table-body');
    const catModal = document.getElementById('category-modal');
    const catForm = document.getElementById('category-form');

    async function loadData() {
      try {
        const [catsRes, prodsRes] = await Promise.all([
          Api.get('/categories').catch(() => []),
          Api.get('/products').catch(() => [])
        ]);

        categories = Array.isArray(catsRes) ? catsRes : (catsRes.data || []);
        products = Array.isArray(prodsRes) ? prodsRes : (prodsRes.data || []);

        updateMetrics();
        renderView();
      } catch (err) {
        showToast('Error loading categories: ' + err.message, 'error');
      }
    }

    function updateMetrics() {
      document.getElementById('metric-total-cats').textContent = categories.length;
      document.getElementById('metric-total-assigned').textContent = products.length;
      document.getElementById('metric-active-cats').textContent = categories.filter(c => c.active !== false).length;
    }

    function getProductCountForCat(catId) {
      return products.filter(p => p.categoryId === catId).length;
    }

    function renderView() {
      const query = searchInput.value.toLowerCase().trim();
      const filtered = categories.filter(c => !query || c.name.toLowerCase().includes(query) || (c.slug && c.slug.toLowerCase().includes(query)));

      if (currentView === 'cards') {
        cardsContainer.style.display = 'grid';
        tableContainer.style.display = 'none';

        if (filtered.length === 0) {
          cardsContainer.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--gray-400);">
              No categories found. Click "Create Category" to add one.
            </div>
          `;
          return;
        }

        cardsContainer.innerHTML = filtered.map(cat => {
          const count = getProductCountForCat(cat.id);
          return `
            <div class="category-card">
              <div>
                <div class="category-card-top">
                  <div class="category-icon-box">${cat.icon || '🏷️'}</div>
                  <span class="badge ${cat.active !== false ? 'badge-success' : 'badge-neutral'}">
                    ${cat.active !== false ? 'ACTIVE' : 'HIDDEN'}
                  </span>
                </div>
                <h3 style="font-size: 16px; font-weight: 700; color: var(--gray-900); margin-bottom: 4px;">${cat.name}</h3>
                <p style="font-size: 12px; color: var(--gray-500); margin-bottom: 12px; min-height: 36px;">
                  ${cat.description || 'No description provided.'}
                </p>
              </div>

              <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--gray-100); padding-top: 12px; margin-top: 12px;">
                <span class="badge badge-info" style="font-size: 12px; font-weight: 600;">📦 ${count} Products</span>
                <div style="display: flex; gap: 6px;">
                  <button class="btn btn-secondary btn-edit-cat" data-id="${cat.id}" style="padding: 4px 8px; font-size: 12px;" title="Edit">✏️</button>
                  <button class="btn btn-secondary btn-del-cat" data-id="${cat.id}" style="padding: 4px 8px; font-size: 12px; color: var(--accent-rose);" title="Delete">🗑️</button>
                </div>
              </div>
            </div>
          `;
        }).join('');

      } else {
        cardsContainer.style.display = 'none';
        tableContainer.style.display = 'block';

        if (filtered.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="8" style="text-align: center; padding: 40px; color: var(--gray-400);">
                No categories found.
              </td>
            </tr>
          `;
          return;
        }

        tableBody.innerHTML = filtered.map(cat => {
          const count = getProductCountForCat(cat.id);
          return `
            <tr>
              <td style="font-size: 24px; text-align: center;">${cat.icon || '🏷️'}</td>
              <td style="font-weight: 600; color: var(--gray-900);">${cat.name}</td>
              <td style="font-family: monospace; font-size: 12px; color: var(--gray-600);">${cat.slug || '-'}</td>
              <td style="color: var(--gray-600); font-size: 12px;">${cat.description || '-'}</td>
              <td>${cat.displayOrder || 1}</td>
              <td><span class="badge badge-info">${count} items</span></td>
              <td>
                <span class="badge ${cat.active !== false ? 'badge-success' : 'badge-neutral'}">
                  ${cat.active !== false ? 'ACTIVE' : 'HIDDEN'}
                </span>
              </td>
              <td style="text-align: right;">
                <button class="btn btn-secondary btn-edit-cat" data-id="${cat.id}" style="padding: 4px 8px; font-size: 12px;">✏️ Edit</button>
                <button class="btn btn-secondary btn-del-cat" data-id="${cat.id}" style="padding: 4px 8px; font-size: 12px; color: var(--accent-rose);">🗑️</button>
              </td>
            </tr>
          `;
        }).join('');
      }

      // Attach event listeners
      document.querySelectorAll('.btn-edit-cat').forEach(b => {
        b.addEventListener('click', () => openEditCategory(b.dataset.id));
      });
      document.querySelectorAll('.btn-del-cat').forEach(b => {
        b.addEventListener('click', () => deleteCategory(b.dataset.id));
      });
    }

    // View Switcher Buttons
    document.getElementById('btn-view-cards').addEventListener('click', () => {
      currentView = 'cards';
      document.getElementById('btn-view-cards').classList.add('active');
      document.getElementById('btn-view-table').classList.remove('active');
      renderView();
    });

    document.getElementById('btn-view-table').addEventListener('click', () => {
      currentView = 'table';
      document.getElementById('btn-view-table').classList.add('active');
      document.getElementById('btn-view-cards').classList.remove('active');
      renderView();
    });

    searchInput.addEventListener('input', renderView);

    // Modal Events
    document.getElementById('btn-add-category').addEventListener('click', () => {
      document.getElementById('cat-modal-title').textContent = 'Create Category';
      catForm.reset();
      document.getElementById('cat-id').value = '';
      catModal.classList.add('active');
      document.getElementById('cat-name').focus();
    });

    document.getElementById('close-cat-modal').addEventListener('click', () => catModal.classList.remove('active'));
    document.getElementById('btn-cancel-cat').addEventListener('click', () => catModal.classList.remove('active'));

    function openEditCategory(id) {
      const cat = categories.find(c => c.id === id);
      if (!cat) return;

      document.getElementById('cat-modal-title').textContent = 'Edit Category';
      document.getElementById('cat-id').value = cat.id;
      document.getElementById('cat-name').value = cat.name;
      document.getElementById('cat-icon').value = cat.icon || '🏷️';
      document.getElementById('cat-slug').value = cat.slug || '';
      document.getElementById('cat-order').value = cat.displayOrder || 1;
      document.getElementById('cat-desc').value = cat.description || '';
      document.getElementById('cat-active').value = (cat.active !== false).toString();

      catModal.classList.add('active');
    }

    catForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('cat-id').value;
      const name = document.getElementById('cat-name').value.trim();
      const slug = document.getElementById('cat-slug').value.trim() || name.toLowerCase().replace(/\s+/g, '-');

      const payload = {
        name,
        slug,
        icon: document.getElementById('cat-icon').value.trim() || '🏷️',
        description: document.getElementById('cat-desc').value.trim(),
        displayOrder: parseInt(document.getElementById('cat-order').value) || 1,
        active: document.getElementById('cat-active').value === 'true'
      };

      try {
        const saveBtn = document.getElementById('btn-save-cat');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';

        if (id) {
          await Api.put(`/categories/${id}`, payload);
          showToast('Category updated successfully', 'success');
        } else {
          await Api.post('/categories', payload);
          showToast('Category created successfully', 'success');
        }

        catModal.classList.remove('active');
        await loadData();
      } catch (err) {
        showToast(err.message || 'Failed to save category', 'error');
      } finally {
        const saveBtn = document.getElementById('btn-save-cat');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Category';
      }
    });

    async function deleteCategory(id) {
      if (!confirm('Are you sure you want to delete this category? (It will be rejected if products are assigned to it)')) return;
      try {
        await Api.delete(`/categories/${id}`);
        showToast('Category deleted successfully', 'success');
        await loadData();
      } catch (err) {
        showToast(err.message || 'Could not delete category', 'error');
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '⚠️' : 'ℹ️'}</span> <span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    loadData();
  </script>
</body>
</html>
