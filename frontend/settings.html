<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Settings | FreshGrocery</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    /* Laptop / Windows Desktop Store Settings UI */
    .settings-container {
      max-width: 920px;
      background: #ffffff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      box-shadow: var(--shadow-sm);
    }
    .settings-header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--gray-200);
    }
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--gray-900);
      margin: 26px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .settings-container .form-control {
      min-height: 40px;
    }
    .settings-actions-bar {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--gray-200);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .btn-save-settings {
      height: 42px;
      padding: 0 26px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="topbar-container"></div>
      <main class="content-body">

        <div class="settings-container">
          <div class="settings-header">
            <h2 style="font-size: 18px; font-weight: 800; color: var(--gray-900); margin-bottom: 4px;">Store Settings &amp; POS Configuration</h2>
            <p style="font-size: 13.5px; color: var(--gray-500);">Configure supermarket identity, GSTIN, receipt thermal printers, and inventory alert thresholds.</p>
          </div>

          <form id="settings-form">
            <!-- Store Profile -->
            <div class="section-title" style="margin-top: 0;">🏬 Supermarket Profile</div>
            <div class="form-row">
              <div class="form-group" style="flex: 2;">
                <label class="form-label" for="set-store-name">Store Trade Name *</label>
                <input type="text" id="set-store-name" class="form-control" required />
              </div>
              <div class="form-group" style="flex: 1;">
                <label class="form-label" for="set-currency">Currency Symbol</label>
                <input type="text" id="set-currency" class="form-control" value="₹" />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="set-phone">Store Contact Phone</label>
                <input type="text" id="set-phone" class="form-control" />
              </div>
              <div class="form-group">
                <label class="form-label" for="set-email">Official Email</label>
                <input type="email" id="set-email" class="form-control" />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group" style="flex: 2;">
                <label class="form-label" for="set-address">Physical Address</label>
                <input type="text" id="set-address" class="form-control" />
              </div>
              <div class="form-group" style="flex: 1;">
                <label class="form-label" for="set-city">City</label>
                <input type="text" id="set-city" class="form-control" />
              </div>
            </div>

            <!-- Tax & Regulatory -->
            <div class="section-title">🧾 Tax, GST &amp; Billing Configuration</div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="set-gstin">GSTIN / Tax Identification</label>
                <input type="text" id="set-gstin" class="form-control" />
              </div>
              <div class="form-group">
                <label class="form-label" for="set-tax-rate">Default GST Rate (%)</label>
                <input type="number" step="0.5" id="set-tax-rate" class="form-control" />
              </div>
            </div>

            <!-- Thermal Receipt -->
            <div class="section-title">🖨️ Thermal Receipt Printer Customization</div>
            <div class="form-group">
              <label class="form-label" for="set-receipt-header">Receipt Header Tagline</label>
              <textarea id="set-receipt-header" class="form-control" rows="2"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" for="set-receipt-footer">Receipt Footer Return Policy</label>
              <textarea id="set-receipt-footer" class="form-control" rows="2"></textarea>
            </div>

            <!-- Inventory Rules -->
            <div class="section-title">📦 Inventory &amp; Operational Rules</div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="set-min-stock">Global Low-Stock Reorder Threshold (Units)</label>
                <input type="number" id="set-min-stock" class="form-control" />
              </div>
              <div class="form-group">
                <label class="form-label" for="set-expiry-window">Near-Expiry Warning Window (Days)</label>
                <input type="number" id="set-expiry-window" class="form-control" />
              </div>
            </div>

            <div class="settings-actions-bar">
              <button type="submit" class="btn btn-primary btn-save-settings" id="btn-save-settings">
                💾 Save All Store Settings
              </button>
            </div>
          </form>
        </div>

      </main>
    </div>
  </div>

  <script type="module">
    import { Layout } from './js/layout.js';
    import { Api } from './js/api.js';

    Layout.init({ activePage: 'settings', title: 'Store Settings' });

    const form = document.getElementById('settings-form');

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadSettings() {
      try {
        const s = await Api.get('/settings').catch(() => ({}));
        if (s) {
          document.getElementById('set-store-name').value = s.storeName || 'FreshGrocery Supermarket';
          document.getElementById('set-currency').value = s.currencySymbol || '₹';
          document.getElementById('set-phone').value = s.phone || '+91 98765 43210';
          document.getElementById('set-email').value = s.email || 'support@freshgrocery.local';
          document.getElementById('set-address').value = s.address || 'Green Valley Commercial Complex';
          document.getElementById('set-city').value = s.city || 'Bengaluru';
          document.getElementById('set-gstin').value = s.gstin || '29ABCDE1234F1Z5';
          document.getElementById('set-tax-rate').value = s.defaultTaxRate || 5.0;
          document.getElementById('set-receipt-header').value = s.receiptHeader || 'FreshGrocery Supermarket\nEat Fresh, Live Healthy';
          document.getElementById('set-receipt-footer').value = s.receiptFooter || 'Thank you for shopping with us!\nItems once sold can be returned within 3 days with receipt.';
          document.getElementById('set-min-stock').value = s.defaultMinStockThreshold || 10;
          document.getElementById('set-expiry-window').value = s.nearExpiryDaysWindow || 30;
        }
      } catch (err) {
        showToast('Error loading store settings', 'error');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        storeName: document.getElementById('set-store-name').value.trim(),
        currencySymbol: document.getElementById('set-currency').value.trim(),
        phone: document.getElementById('set-phone').value.trim(),
        email: document.getElementById('set-email').value.trim(),
        address: document.getElementById('set-address').value.trim(),
        city: document.getElementById('set-city').value.trim(),
        gstin: document.getElementById('set-gstin').value.trim(),
        defaultTaxRate: parseFloat(document.getElementById('set-tax-rate').value) || 5.0,
        receiptHeader: document.getElementById('set-receipt-header').value.trim(),
        receiptFooter: document.getElementById('set-receipt-footer').value.trim(),
        defaultMinStockThreshold: parseFloat(document.getElementById('set-min-stock').value) || 10,
        nearExpiryDaysWindow: parseInt(document.getElementById('set-expiry-window').value, 10) || 30
      };

      try {
        const btn = document.getElementById('btn-save-settings');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        await Api.put('/settings', payload);
        showToast('Store settings saved successfully', 'success');
      } catch (err) {
        showToast(err.message || 'Failed to update settings', 'error');
      } finally {
        const btn = document.getElementById('btn-save-settings');
        btn.disabled = false;
        btn.textContent = '💾 Save All Store Settings';
      }
    });

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '⚠️' : 'ℹ️'}</span> <span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    loadSettings();
  </script>
</body>
</html>
