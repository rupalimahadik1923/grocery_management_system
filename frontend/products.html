<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | FreshGrocery</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .metric-mini-card {
      background: #ffffff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }
    .metric-mini-val {
      font-size: 24px;
      font-weight: 800;
      color: var(--gray-900);
    }
    .metric-mini-lbl {
      font-size: 12px;
      color: var(--gray-500);
      font-weight: 500;
    }
    .toolbar-container {
      background: #ffffff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .toolbar-filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="topbar-container"></div>
      <main class="content-body">
        
        <!-- Metrics Ribbon -->
        <div class="metrics-bar">
          <div class="metric-mini-card">
            <div>
              <div class="metric-mini-val" id="metric-total-prod">0</div>
              <div class="metric-mini-lbl">Total Catalog Items</div>
            </div>
            <div style="font-size: 28px;">📦</div>
          </div>
          <div class="metric-mini-card">
            <div>
              <div class="metric-mini-val" id="metric-in-stock" style="color: var(--primary-700);">0</div>
              <div class="metric-mini-lbl">In-Stock & Active</div>
            </div>
            <div style="font-size: 28px;">✅</div>
          </div>
          <div class="metric-mini-card">
            <div>
              <div class="metric-mini-val" id="metric-low-stock" style="color: var(--accent-amber);">0</div>
              <div class="metric-mini-lbl">Low Stock (< Min Level)</div>
            </div>
            <div style="font-size: 28px;">⚠️</div>
          </div>
          <div class="metric-mini-card">
            <div>
              <div class="metric-mini-val" id="metric-out-stock" style="color: var(--accent-rose);">0</div>
              <div class="metric-mini-lbl">Out of Stock (0 units)</div>
            </div>
            <div style="font-size: 28px;">🚫</div>
          </div>
        </div>

        <!-- Filter & Action Toolbar -->
        <div class="toolbar-container">
          <div class="toolbar-filters">
            <input 
              type="text" 
              id="product-search-input" 
              class="form-control" 
              style="max-width: 280px;" 
              placeholder="Search by name, SKU, barcode..." 
            />
            <select id="filter-category" class="form-control" style="max-width: 180px;">
              <option value="ALL">All Categories</option>
            </select>
            <select id="filter-status" class="form-control" style="max-width: 150px;">
              <option value="ALL">All Status</option>
              <option value="ACTIVE">Active</option>
              <option value="LOW_STOCK">Low Stock</option>
              <option value="OUT_OF_STOCK">Out of Stock</option>
              <option value="INACTIVE">Inactive</option>
            </select>
          </div>
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-secondary" id="btn-export-csv">📥 Export CSV</button>
            <button class="btn btn-primary" id="btn-add-product">➕ Add New Product</button>
          </div>
        </div>

        <!-- Products Table Card -->
        <div class="table-container">
          <table class="data-table" id="products-table">
            <thead>
              <tr>
                <th>Product Information</th>
                <th>Category</th>
                <th>Unit</th>
                <th>Cost Price</th>
                <th>Selling Price</th>
                <th>Current Stock</th>
                <th>Status</th>
                <th style="text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody id="products-table-body">
              <tr>
                <td colspan="8" style="text-align: center; padding: 40px; color: var(--gray-400);">
                  Loading product catalog...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <!-- ADD / EDIT PRODUCT MODAL -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal-content" style="max-width: 580px;">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Add New Product</h3>
        <button class="modal-close-btn" id="close-prod-modal">&times;</button>
      </div>
      <form id="product-form">
        <div class="modal-body" style="padding: 20px 24px;">
          <input type="hidden" id="prod-id" />
          
          <div class="form-group">
            <label class="form-label">Product Name *</label>
            <input type="text" id="prod-name" class="form-control" required placeholder="e.g. Amul Taaza Milk 500ml" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">SKU Code *</label>
              <input type="text" id="prod-sku" class="form-control" required placeholder="e.g. SKU-MILK-01" />
            </div>
            <div class="form-group">
              <label class="form-label">Barcode Number</label>
              <input type="text" id="prod-barcode" class="form-control" placeholder="e.g. 890123456789" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Category *</label>
              <select id="prod-category" class="form-control" required>
                <option value="">Select Category</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Unit of Measure *</label>
              <select id="prod-unit" class="form-control" required>
                <option value="PACK">PACK</option>
                <option value="PCS">PCS</option>
                <option value="KG">KG</option>
                <option value="G">G (Grams)</option>
                <option value="LITER">LITER</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Cost Price (₹) *</label>
              <input type="number" step="0.01" id="prod-cost" class="form-control" required placeholder="0.00" />
            </div>
            <div class="form-group">
              <label class="form-label">Selling Price (₹) *</label>
              <input type="number" step="0.01" id="prod-price" class="form-control" required placeholder="0.00" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Initial Stock Qty *</label>
              <input type="number" step="0.1" id="prod-stock" class="form-control" required placeholder="0" />
            </div>
            <div class="form-group">
              <label class="form-label">Min Alert Threshold</label>
              <input type="number" step="0.1" id="prod-min-stock" class="form-control" value="10" placeholder="10" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">GST / Tax Rate (%)</label>
              <select id="prod-tax" class="form-control">
                <option value="0">0% (Nil / Exempt)</option>
                <option value="5" selected>5% (Standard Grocery)</option>
                <option value="12">12%</option>
                <option value="18">18%</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Status</label>
              <select id="prod-status" class="form-control">
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Product Description / Notes</label>
            <textarea id="prod-desc" class="form-control" rows="2" placeholder="Optional notes..."></textarea>
          </div>
        </div>

        <div class="modal-footer" style="padding: 16px 24px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 8px;">
          <button type="button" class="btn btn-secondary" id="btn-cancel-prod">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-prod">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { Layout } from './js/layout.js';
    import { Api } from './js/api.js';

    Layout.init({ activePage: 'products', title: 'Product Catalog' });

    let products = [];
    let categories = [];

    const tableBody = document.getElementById('products-table-body');
    const searchInput = document.getElementById('product-search-input');
    const filterCat = document.getElementById('filter-category');
    const filterStat = document.getElementById('filter-status');
    const productModal = document.getElementById('product-modal');
    const productForm = document.getElementById('product-form');

    async function loadData() {
      try {
        const [catsRes, prodsRes] = await Promise.all([
          Api.get('/categories').catch(() => []),
          Api.get('/products').catch(() => [])
        ]);

        categories = Array.isArray(catsRes) ? catsRes : (catsRes.data || []);
        products = Array.isArray(prodsRes) ? prodsRes : (prodsRes.data || []);

        populateCategoryDropdowns();
        updateMetrics();
        renderTable();
      } catch (err) {
        showToast('Error loading products: ' + err.message, 'error');
      }
    }

    function populateCategoryDropdowns() {
      const optionsHtml = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      filterCat.innerHTML = `<option value="ALL">All Categories</option>` + optionsHtml;
      document.getElementById('prod-category').innerHTML = `<option value="">Select Category</option>` + optionsHtml;
    }

    function updateMetrics() {
      const total = products.length;
      const inStock = products.filter(p => p.currentStock > p.minStockLevel && p.status === 'ACTIVE').length;
      const lowStock = products.filter(p => p.currentStock <= p.minStockLevel && p.currentStock > 0).length;
      const outOfStock = products.filter(p => p.currentStock <= 0).length;

      document.getElementById('metric-total-prod').textContent = total;
      document.getElementById('metric-in-stock').textContent = inStock;
      document.getElementById('metric-low-stock').textContent = lowStock;
      document.getElementById('metric-out-stock').textContent = outOfStock;
    }

    function renderTable() {
      const query = searchInput.value.toLowerCase().trim();
      const cat = filterCat.value;
      const stat = filterStat.value;

      let filtered = products.filter(p => {
        const matchesQuery = !query || 
          p.name.toLowerCase().includes(query) || 
          (p.sku && p.sku.toLowerCase().includes(query)) ||
          (p.barcode && p.barcode.toLowerCase().includes(query));

        const matchesCat = cat === 'ALL' || p.categoryId === cat;

        let matchesStat = true;
        if (stat === 'ACTIVE') matchesStat = p.status === 'ACTIVE';
        else if (stat === 'INACTIVE') matchesStat = p.status === 'INACTIVE';
        else if (stat === 'LOW_STOCK') matchesStat = p.currentStock <= p.minStockLevel && p.currentStock > 0;
        else if (stat === 'OUT_OF_STOCK') matchesStat = p.currentStock <= 0;

        return matchesQuery && matchesCat && matchesStat;
      });

      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="8" style="text-align: center; padding: 40px; color: var(--gray-400);">
              No products found matching the criteria.
            </td>
          </tr>
        `;
        return;
      }

      tableBody.innerHTML = filtered.map(prod => {
        let stockBadge = `<span class="badge badge-success">${prod.currentStock} ${prod.unit}</span>`;
        if (prod.currentStock <= 0) {
          stockBadge = `<span class="badge badge-danger">Out of Stock (0)</span>`;
        } else if (prod.currentStock <= prod.minStockLevel) {
          stockBadge = `<span class="badge badge-warning">Low: ${prod.currentStock} ${prod.unit}</span>`;
        }

        const statusBadge = prod.status === 'ACTIVE' 
          ? `<span class="badge badge-success">ACTIVE</span>` 
          : `<span class="badge badge-neutral">INACTIVE</span>`;

        return `
          <tr>
            <td>
              <div style="font-weight: 600; color: var(--gray-900);">${prod.name}</div>
              <div style="font-size: 11px; color: var(--gray-500);">
                SKU: ${prod.sku} | Barcode: ${prod.barcode || 'N/A'}
              </div>
            </td>
            <td><span class="badge badge-neutral">${prod.categoryName || 'Unassigned'}</span></td>
            <td>${prod.unit}</td>
            <td>₹${prod.costPrice?.toFixed(2)}</td>
            <td style="font-weight: 700; color: var(--primary-700);">₹${prod.sellingPrice?.toFixed(2)}</td>
            <td>${stockBadge}</td>
            <td>${statusBadge}</td>
            <td style="text-align: right;">
              <button class="btn btn-secondary btn-edit" data-id="${prod.id}" style="padding: 4px 8px; font-size: 12px;" title="Edit Product">✏️</button>
              <button class="btn btn-secondary btn-status-toggle" data-id="${prod.id}" data-current="${prod.status}" style="padding: 4px 8px; font-size: 12px;" title="Toggle Status">
                ${prod.status === 'ACTIVE' ? '🚫' : '✅'}
              </button>
              <button class="btn btn-secondary btn-delete" data-id="${prod.id}" style="padding: 4px 8px; font-size: 12px; color: var(--accent-rose);" title="Delete Product">🗑️</button>
            </td>
          </tr>
        `;
      }).join('');

      tableBody.querySelectorAll('.btn-edit').forEach(btn => {
        btn.addEventListener('click', () => openEditModal(btn.dataset.id));
      });
      tableBody.querySelectorAll('.btn-status-toggle').forEach(btn => {
        btn.addEventListener('click', () => toggleStatus(btn.dataset.id, btn.dataset.current));
      });
      tableBody.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', () => deleteProduct(btn.dataset.id));
      });
    }

    searchInput.addEventListener('input', renderTable);
    filterCat.addEventListener('change', renderTable);
    filterStat.addEventListener('change', renderTable);

    // Add Product Modal
    document.getElementById('btn-add-product').addEventListener('click', () => {
      document.getElementById('modal-title').textContent = 'Add New Product';
      productForm.reset();
      document.getElementById('prod-id').value = '';
      productModal.classList.add('active');
      document.getElementById('prod-name').focus();
    });

    document.getElementById('close-prod-modal').addEventListener('click', () => productModal.classList.remove('active'));
    document.getElementById('btn-cancel-prod').addEventListener('click', () => productModal.classList.remove('active'));

    function openEditModal(id) {
      const prod = products.find(p => p.id === id);
      if (!prod) return;

      document.getElementById('modal-title').textContent = 'Edit Product';
      document.getElementById('prod-id').value = prod.id;
      document.getElementById('prod-name').value = prod.name;
      document.getElementById('prod-sku').value = prod.sku;
      document.getElementById('prod-barcode').value = prod.barcode || '';
      document.getElementById('prod-category').value = prod.categoryId || '';
      document.getElementById('prod-unit').value = prod.unit;
      document.getElementById('prod-cost').value = prod.costPrice;
      document.getElementById('prod-price').value = prod.sellingPrice;
      document.getElementById('prod-stock').value = prod.currentStock;
      document.getElementById('prod-min-stock').value = prod.minStockLevel;
      document.getElementById('prod-tax').value = prod.taxRate || 5;
      document.getElementById('prod-status').value = prod.status;
      document.getElementById('prod-desc').value = prod.description || '';

      productModal.classList.add('active');
    }

    productForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('prod-id').value;
      const catSelect = document.getElementById('prod-category');
      const selectedCatText = catSelect.options[catSelect.selectedIndex]?.text || '';

      const payload = {
        name: document.getElementById('prod-name').value.trim(),
        sku: document.getElementById('prod-sku').value.trim(),
        barcode: document.getElementById('prod-barcode').value.trim(),
        categoryId: catSelect.value,
        categoryName: selectedCatText,
        unit: document.getElementById('prod-unit').value,
        costPrice: parseFloat(document.getElementById('prod-cost').value) || 0,
        sellingPrice: parseFloat(document.getElementById('prod-price').value) || 0,
        currentStock: parseFloat(document.getElementById('prod-stock').value) || 0,
        minStockLevel: parseFloat(document.getElementById('prod-min-stock').value) || 10,
        taxRate: parseFloat(document.getElementById('prod-tax').value) || 5,
        status: document.getElementById('prod-status').value,
        description: document.getElementById('prod-desc').value.trim()
      };

      try {
        const saveBtn = document.getElementById('btn-save-prod');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';

        if (id) {
          await Api.put(`/products/${id}`, payload);
          showToast('Product updated successfully', 'success');
        } else {
          await Api.post('/products', payload);
          showToast('Product created successfully', 'success');
        }

        productModal.classList.remove('active');
        await loadData();
      } catch (err) {
        showToast(err.message || 'Failed to save product', 'error');
      } finally {
        const saveBtn = document.getElementById('btn-save-prod');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Product';
      }
    });

    async function toggleStatus(id, current) {
      const newStatus = current === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE';
      try {
        await Api.request(`/products/${id}/status`, {
          method: 'PATCH',
          body: JSON.stringify({ status: newStatus })
        });
        showToast(`Product set to ${newStatus}`, 'success');
        await loadData();
      } catch (err) {
        showToast(err.message || 'Status update failed', 'error');
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Are you sure you want to delete this product?')) return;
      try {
        await Api.delete(`/products/${id}`);
        showToast('Product deleted', 'success');
        await loadData();
      } catch (err) {
        showToast(err.message || 'Failed to delete product', 'error');
      }
    }

    // CSV Export
    document.getElementById('btn-export-csv').addEventListener('click', () => {
      if (products.length === 0) {
        showToast('No products to export', 'error');
        return;
      }
      const headers = ['Name', 'SKU', 'Barcode', 'Category', 'Unit', 'Cost Price', 'Selling Price', 'Current Stock', 'Min Stock', 'Status'];
      const rows = products.map(p => [
        `"${p.name}"`,
        `"${p.sku}"`,
        `"${p.barcode || ''}"`,
        `"${p.categoryName || ''}"`,
        `"${p.unit}"`,
        p.costPrice,
        p.sellingPrice,
        p.currentStock,
        p.minStockLevel,
        `"${p.status}"`
      ]);

      const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `FreshGrocery_Products_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast('Exported products CSV successfully', 'success');
    });

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '⚠️' : 'ℹ️'}</span> <span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    loadData();
  </script>
</body>
</html>
